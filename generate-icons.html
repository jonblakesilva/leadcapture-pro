<!DOCTYPE html>
<!--
  LeadCapture Pro — Icon Generator
  Open this file in Chrome, then click "Download All Icons".
  The three PNG files will download. Place them in the icons/ folder.
  This file is NOT part of the extension — it's a dev helper only.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Icons</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 32px; background: #f1f5f9; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #64748b; margin-bottom: 24px; }
    .canvases { display: flex; gap: 24px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 24px; }
    .icon-wrap { text-align: center; }
    .icon-wrap span { display: block; font-size: 12px; color: #64748b; margin-top: 6px; }
    canvas { display: block; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    button {
      background: #2563eb; color: white; border: none; padding: 12px 24px;
      border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .color-row { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    label { font-size: 14px; font-weight: 500; }
    input[type="color"] { width: 40px; height: 36px; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; }
    input[type="text"] { padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; width: 100px; }
  </style>
</head>
<body>
  <h1>LeadCapture Pro — Icon Generator</h1>
  <p>Customize the color and letter, preview the icons, then download all three sizes.</p>

  <div class="color-row">
    <label for="icon-color">Color:</label>
    <input type="color" id="icon-color" value="#2563eb">
    <label for="icon-letter">Letter:</label>
    <input type="text" id="icon-letter" value="L" maxlength="2">
    <button onclick="generateAll()">Preview</button>
  </div>

  <div class="canvases">
    <div class="icon-wrap">
      <canvas id="c16" width="16" height="16"></canvas>
      <span>16×16</span>
    </div>
    <div class="icon-wrap">
      <canvas id="c48" width="48" height="48"></canvas>
      <span>48×48</span>
    </div>
    <div class="icon-wrap">
      <canvas id="c128" width="128" height="128"></canvas>
      <span>128×128</span>
    </div>
  </div>

  <button onclick="downloadAll()">⬇ Download All Icons</button>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      const color = document.getElementById('icon-color').value || '#2563eb';
      const letter = (document.getElementById('icon-letter').value || 'L').slice(0, 2).toUpperCase();
      const r = size * 0.18;

      ctx.clearRect(0, 0, size, size);

      // Rounded rect background
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();

      // White letter
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `bold ${Math.round(size * 0.52)}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
      ctx.fillText(letter, size / 2, size / 2 + size * 0.025);
    }

    function generateAll() {
      [16, 48, 128].forEach(size => {
        const canvas = document.getElementById('c' + size);
        drawIcon(canvas, size);
      });
    }

    function downloadAll() {
      generateAll();
      [16, 48, 128].forEach(size => {
        const canvas = document.getElementById('c' + size);
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `icon${size}.png`;
        a.click();
      });
    }

    // Auto-generate on load
    generateAll();

    // Live preview on input change
    document.getElementById('icon-color').addEventListener('input', generateAll);
    document.getElementById('icon-letter').addEventListener('input', generateAll);
  </script>
</body>
</html>
